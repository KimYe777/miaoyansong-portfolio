<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8faf6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="清感" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="app-icon.svg" type="image/svg+xml" />
  <title>清感 ClearSense</title>
  <link rel="stylesheet" href="styles.css?v=20260807-2" />
</head>
<body>
  <main class="prototype-stage">
    <section class="phone" aria-label="ClearSense 手机端原型">
      <div id="app" class="app"></div>
    </section>
    <aside class="review-panel">
      <div class="eyebrow">CLEARSENSE · INTERACTIVE</div>
      <h1>在症状之前，<br/>先一步感知环境。</h1>
      <p>从今日判断到风险解释、行动建议、症状记录与晚间总结，这是一条可以真实操作的陪伴闭环。</p>
      <div class="control-group">
        <div class="control-label">演示风险状态</div>
        <div class="segmented">
          <button class="demo-btn" data-demo-risk="low">低风险</button>
          <button class="demo-btn" data-demo-risk="high">风险升高</button>
        </div>
      </div>
      <button class="reset-btn" data-action="reset">重置演示</button>
      <div class="review-path"><i></i><span>推荐路径：风险升高 → 点击水滴 → 查看建议 → 记录感受。</span></div>
      <div class="note">桌面右侧为演示控制，不属于 App 正式界面。</div>
    </aside>
  </main>
  <script src="app.js?v=20260807-2"></script>
</body>
</html>
